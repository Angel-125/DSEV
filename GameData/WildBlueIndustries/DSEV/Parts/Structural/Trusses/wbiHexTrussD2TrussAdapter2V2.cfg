	crashTolerance = 45
	breakingForce = 1250
	breakingTorque = 1250
	maxTemp = 2000
	fuelCrossFeed = True
	heatConductivity = 0.001
	tags = cck-DSEV

	MODULE
	{
		name = ModulePartVariants
		baseVariant = Standard
		useMultipleDragCubes = false

		VARIANT
		{
			name = Standard
			displayName = Standard
			primaryColor = #777777
			secondaryColor = #444444
			GAMEOBJECTS
			{
				CrewTube = false
			}
		}

		VARIANT
		{
			name = CrewTube
			displayName = Crew Tube
			primaryColor = #ffffff
			secondaryColor = #3a562a
			GAMEOBJECTS
			{
				CrewTube = true
			}
		}
	}

