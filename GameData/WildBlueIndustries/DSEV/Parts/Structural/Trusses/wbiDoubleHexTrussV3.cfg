PART
{
	// this is a sample config file, for determining a good file format for defining part parameters
	// comment line - ignored by cfg parser
	// empty lines, or lines without a '=' sign are also ignored
	// all other lines are split at the '=' sign, and the left operand is used to know what parameter we are setting
	// diferent parameters require data in different formats (see docs), and each module has it's own parameters (again, see docs)
	// each assignment must be in a single line. Lines without assignments will be ignored. (You CAN turn on word wrap, though)
	// each keyword here relates to an existing variable in the assigned module. If the keyword isn't found, it is ignored.
	// conversely, if a keyword is left unassigned (as in not in the file), it will be initialized with it's default value
	// This is done automatically, so any public variable defined in the loaded module can be accessed this way (provided it's value can be parsed)

	// --- general parameters ---
	name = wbiDoubleHexTrussV3
	module = Part
	author = Michael Billard (Angel-125)

	// --- asset parameters ---
	rescaleFactor = 1
	MODEL
	{
		model = WildBlueIndustries/DSEV/Parts/Structural/Trusses/DoubleHexTruss
	}

	// --- node definitions ---
	// definition format is Position X, Position Y, Position Z, Up X, Up Y, Up Z
	node_stack_top = 0.0, 4.2, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_innerTop = 0.0, 4.0, 0.0, 0.0, -1.0, 0.0, 2
	node_stack_innerBtm = 0.0, -4.0, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_bottom = 0.0, -4.2, 0.0, 0.0, -1.0, 0.0, 2

	// --- editor parameters ---
	TechRequired = specializedConstruction
	entryCost = 13250
	cost = 4800
	category = Structural
	subcategory = 0
	title = Hex Truss (Double) V3
	manufacturer = Wild Blue Industries
	description = What could be better than one hexagonal truss? One hexagonal truss that's really long! Twice the size of a regular hexagonal truss, the double truss gives you even more room to put equipment on or inside- and more places for kerbals, er, kids, to climb on.

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,1

	// --- standard part parameters ---
	mass = 3.0
	dragModelType = default
	maximum_drag = 0.25
	minimum_drag = 0.25
	angularDrag = .5
	crashTolerance = 45
	breakingForce = 1250
	breakingTorque = 1250
	maxTemp = 2000
	fuelCrossFeed = True
	heatConductivity = 0.001
	tags = cck-DSEV


	MODULE:NEEDS[WildBlueCore]
	{
		name = WBIModuleFuelPump
	}

	MODULE
	{
		name = ModulePartVariants
		baseVariant = FuelTank
		useMultipleDragCubes = false

		VARIANT
		{
			name = Hollow
			displayName = Hollow
			primaryColor = #777777
			secondaryColor = #444444
			GAMEOBJECTS
			{
				Equipment = true
				FuelTank = false
				CrewTube = false
				HollowTruss = true
				SolidTruss = false
				Decals = false
				endcaps = false
			}
			EXTRA_INFO
			{
				isFuelTank = false
			}
		}

		VARIANT
		{
			name = Empty
			displayName = Empty
			primaryColor = #777777
			secondaryColor = #444444
			GAMEOBJECTS
			{
				Equipment = false
				FuelTank = false
				CrewTube = false
				HollowTruss = false
				SolidTruss = true
				Decals = false
				endcaps = false
			}
			EXTRA_INFO
			{
				isFuelTank = false
			}
		}

		VARIANT
		{
			name = CrewTube
			displayName = CrewTube
			primaryColor = #ffffff
			secondaryColor = #3a562a
			GAMEOBJECTS
			{
				Equipment = false
				FuelTank = false
				CrewTube = true
				HollowTruss = false
				SolidTruss = true
				Decals = false
				endcaps = false
			}
			EXTRA_INFO
			{
				isFuelTank = false
			}
		}

		VARIANT
		{
			name = FuelTank
			displayName = FuelTank
			primaryColor = #3a562a
			secondaryColor = #d0a85c
			GAMEOBJECTS
			{
				Equipment = false
				FuelTank = true
				CrewTube = false
				HollowTruss = false
				SolidTruss = true
				Decals = false
				endcaps = true
			}
			EXTRA_INFO
			{
				isFuelTank = true
			}
		}
	}

	MODULE
	{
		name = WBIModuleDSEVResourceVariants
	}

}
