PART
{
	// this is a sample config file, for determining a good file format for defining part parameters
	// comment line - ignored by cfg parser
	// empty lines, or lines without a '=' sign are also ignored
	// all other lines are split at the '=' sign, and the left operand is used to know what parameter we are setting
	// diferent parameters require data in different formats (see docs), and each module has it's own parameters (again, see docs)
	// each assignment must be in a single line. Lines without assignments will be ignored. (You CAN turn on word wrap, though)
	// each keyword here relates to an existing variable in the assigned module. If the keyword isn't found, it is ignored.
	// conversely, if a keyword is left unassigned (as in not in the file), it will be initialized with it's default value
	// This is done automatically, so any public variable defined in the loaded module can be accessed this way (provided it's value can be parsed)

	// --- general parameters ---
	name = wbiHexNodeV3
	module = Part
	author = Michael Billard (Angel-125)

	// --- asset parameters ---
	rescaleFactor = 1
	MODEL
	{
		model = WildBlueIndustries/DSEV/Parts/Structural/Trusses/HexNode
	}

	// --- node definitions ---
	// definition format is Position X, Position Y, Position Z, Up X, Up Y, Up Z
	node_stack_right = 1.25, 0, 0, 1, 0, 0, 2
	node_stack_left = -1.25, 0, 0, -1, 0, 0, 2

	node_stack_back = 0, 0, 1.25, 0, 0, 1, 2
	node_stack_front = 0, 0,-1.25, 0, 0, -1, 2

	node_stack_top = 0, 1.22, 0, 0, 1, 0, 2
	node_stack_bottom = 0,-1.22, 0, 0, -1, 0, 2
	node_attach = 0,-1.22, 0, 0, -1, 0, 2

	// --- editor parameters ---
	TechRequired = advConstruction
	entryCost = 19500
	cost = 975
	category = Structural
	subcategory = 0
	title = Hex Node V3
	manufacturer = Wild Blue Industries
	description = While creating long truss assemblies can be fun, there are times when it's great to be able to turn a corner. The Hex Node gives builders that ability. Do not use the Hex Node as a giant die for role playing games. Ok fine, you roll a 2.

	// attachment rules: stack, srfAttach, allowStack, allowSrfAttach, allowCollision
	attachRules = 1,1,1,1,0

	// --- standard part parameters ---
	mass = 1.25
	dragModelType = default
	maximum_drag = 0.25
	minimum_drag = 0.25
	angularDrag = .5
	crashTolerance = 45
	breakingForce = 1250
	breakingTorque = 1250
	maxTemp = 2000
	fuelCrossFeed = True
	heatConductivity = 0.001
	stackSymmetry = 1
	tags = cck-DSEV

	MODULE
	{
		name = ModulePartVariants
		baseVariant = Empty
		useMultipleDragCubes = false

		VARIANT
		{
			name = Empty
			displayName = Empty
			primaryColor = #777777
			secondaryColor = #444444
			GAMEOBJECTS
			{
				MainBody = true
				CrewTubeTopBottom = false
				CrewTubeFrontBack = false
				CrewTubeLeftRight = false
			}
		}

		VARIANT
		{
			name = CrewTubes
			displayName = Crew Tubes
			primaryColor = #ffffff
			secondaryColor = #3a562a
			GAMEOBJECTS
			{
				MainBody = true
				CrewTubeTopBottom = true
				CrewTubeFrontBack = true
				CrewTubeLeftRight = true
			}
		}

		VARIANT
		{
			name = TopBottomTubes
			displayName = Top/Bottom Tubes
			primaryColor = #ffffff
			secondaryColor = #3a562a
			GAMEOBJECTS
			{
				MainBody = true
				CrewTubeTopBottom = true
				CrewTubeFrontBack = false
				CrewTubeLeftRight = false
			}
		}

		VARIANT
		{
			name = FrontBackTubes
			displayName = Front/Back Tubes
			primaryColor = #ffffff
			secondaryColor = #3a562a
			GAMEOBJECTS
			{
				MainBody = true
				CrewTubeTopBottom = false
				CrewTubeFrontBack = true
				CrewTubeLeftRight = false
			}
		}

		VARIANT
		{
			name = LeftRightTubes
			displayName = Left/Right Tubes
			primaryColor = #ffffff
			secondaryColor = #3a562a
			GAMEOBJECTS
			{
				MainBody = true
				CrewTubeTopBottom = false
				CrewTubeFrontBack = false
				CrewTubeLeftRight = true
			}
		}
	}

}
