		{
			ResourceName = ElectricCharge
			Ratio = 5
		}

		INPUT_RESOURCE
		{
			ResourceName = ResearchKits
			Ratio = 0.00055554
		}

		OUTPUT_RESOURCE
		{
			ResourceName = LabTime
			Ratio = 0.00056
			DumpExcess = true
		}
	}   	

}

