// The V2 shields separate deployment from storage. The legacy LFO template holds
// 810 LiquidFuel + 990 Oxidizer; capacityFactor 50 and 5 liters per unit gives
// (810 + 990) * 50 * 5 = 450,000 liters of configurable storage.
@PART[wbiStorageShieldV2,wbiStorageShield5mV2]
{
	MODULE:NEEDS[WBIResources|WBIOmniResources]
	{
		name = WBIOmniStorage
		storageVolume = 450000
		reconfigureSkill = ConverterSkill
		reconfigureRank = 1
		requiredResource = Equipment
		requiredAmount = 0
	}

	MODULE:NEEDS[WBIResources|WBIOmniResources]
	{
		name = WBIModuleDSEVDeployableStorage
		animationModuleID = storageShieldDeploy
		storageModuleName = WBIOmniStorage
		deployedThreshold = 0.999
		removeResourcesWhenDisabled = true
	}
}

